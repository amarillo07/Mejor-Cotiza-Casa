<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mejor Cotiza Casa</title>
<meta name="description" content="Guarda, cotiza y compara casas: tu asistente personal de vivienda." />
<meta name="theme-color" content="#2F5FFF" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-180.png" />
<!-- Hace que al "Agregar a pantalla de inicio" en el celular abra como app instalada, no como acceso directo del navegador -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Cotiza Casa" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin: 0; padding: 0; background: #EEF1F8; }
  * { -webkit-tap-highlight-color: transparent; }
  .mcc-serif { font-family: 'Urbanist', sans-serif; font-weight: 700; letter-spacing: -0.01em; }
  .mcc-sans { font-family: 'Urbanist', sans-serif; }
  .mcc-scroll::-webkit-scrollbar { display: none; }
  .mcc-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  .leaflet-container { font-family: 'Urbanist', sans-serif; }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
  }
}
</script>
</head>
<body class="mcc-sans">
<div id="root"></div>

<!-- Mapa (OpenStreetMap, sin API key) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Exportar PDF -->
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<!-- Babel transforma el JSX de app.jsx directo en el navegador: no hace falta build ni npm install -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script type="text/babel" data-type="module" data-presets="react" src="./app.jsx"></script>

<script>
  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        reg.update();
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
